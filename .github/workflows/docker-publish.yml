name: docker-publish

# Builds and publishes the PlaylistChaser API and client container images to GitHub Container
# Registry (ghcr.io) on every push to a default branch, plus on-demand via workflow_dispatch.
#
# Why this exists: building the Docker images requires a Docker daemon, which isn't available
# in every dev environment (e.g. this repo's images were authored without one locally). GitHub
# Actions runners have Docker built in, so this workflow is the easiest way to get real,
# pre-built images you can pull anywhere - including onto a TrueNAS SCALE box, which runs Docker
# under the hood but expects pre-built images (`image:`) rather than a build context (`build:`)
# in its "Custom App > Install via YAML" screen. See README.md / AGENTS.md for the TrueNAS
# deployment notes.
#
# Resulting images:
#   ghcr.io/<owner>/<repo>-api:latest
#   ghcr.io/<owner>/<repo>-client:latest
# (and a tag per commit SHA, and per git tag if you push one)

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: PlaylistChaser.Web/Dockerfile
          - name: client
            context: ./PlaylistChaser.Client
            dockerfile: PlaylistChaser.Client/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${{ github.repository }}-${{ matrix.name }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
